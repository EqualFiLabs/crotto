[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
via_ir = true

[fmt]
line_length = 120
tab_width = 4

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = false
