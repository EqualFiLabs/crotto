[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
via_ir = true
code_size_limit = 200_000
fs_permissions = [{ access = "read", path = "./out" }]

[fmt]
line_length = 120
tab_width = 4

[lint]
mixed_case_exceptions = ["ERC", "URI", "NFT", "POL", "WETH"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = false
